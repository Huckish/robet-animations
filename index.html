/* Layout: one dark gallery wall, almost no copy. Section name, then clips in a grid sized per clip shape. Single dark look on purpose: the art is made for a dark panel. */
:root{--bg:#0e1014;--panel:#15171c;--line:#23262e;--ink:#fff;--muted:#8c92a2;--cyan:#3fd9ff;--display:"Casagrande Grind","Arial Narrow",sans-serif;--body:"Casagrande Grind",system-ui,sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{max-width:1320px;margin:0 auto;padding-block:36px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:48px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font:400 clamp(30px,5vw,48px)/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
h1 em{font-style:normal;color:var(--cyan)}
.note{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
section{display:flex;flex-direction:column;gap:16px}
h2{font:400 15px/1 var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0;display:flex;align-items:center;gap:16px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.grid.card{grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
.grid.tier{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.grid.sq{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
figure{margin:0;position:relative;min-width:0;border-radius:10px;overflow:hidden;background:var(--panel)}
canvas{width:100%;height:100%;display:block;aspect-ratio:16/10;object-fit:contain;cursor:zoom-in;background:var(--panel)}
.card canvas{aspect-ratio:720/828}.sq canvas{aspect-ratio:4/3}.tier canvas{aspect-ratio:1132/720}
canvas:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
canvas:fullscreen{object-fit:contain;background:#000;cursor:zoom-out}
.pic{width:100%;background:var(--panel) center/cover no-repeat}
figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font-size:12px;color:var(--ink);background:linear-gradient(transparent,rgba(8,9,12,.82));opacity:0;transition:opacity .15s;pointer-events:none}
figure:hover figcaption,figure:focus-within figcaption{opacity:1}
@media (hover:none){figcaption{opacity:1}}
@media (prefers-reduced-motion:reduce){figcaption{transition:none}}
</style>

<script>
/* Clips are painted onto canvases from off-page video elements, so there is no video on the page to save or link to. */
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('dragstart',e=>e.preventDefault());
const state=new WeakMap();
function start(c){
  let s=state.get(c);
  if(!s){
    const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.disablePictureInPicture=true;
    s={v,on:false,ctx:c.getContext('2d')};state.set(c,s);
    fetch(c.dataset.src).then(r=>r.blob()).then(b=>{v.src=URL.createObjectURL(b);if(s.on&&!still)v.play().catch(()=>{})}).catch(()=>{});
    v.addEventListener('loadeddata',()=>{c.width=v.videoWidth;c.height=v.videoHeight;s.ctx.drawImage(v,0,0)});
    const paint=()=>{if(s.on&&v.readyState>1){s.ctx.drawImage(v,0,0)}
      if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(paint);else requestAnimationFrame(paint)};
    paint();
  }
  s.on=true;if(s.v.src&&!still)s.v.play().catch(()=>{});
}
function stop(c){const s=state.get(c);if(s){s.on=false;s.v.pause()}}
const io=new IntersectionObserver(es=>{for(const e of es)e.isIntersecting?start(e.target):stop(e.target)},{rootMargin:'150px'});
document.querySelectorAll('canvas').forEach(c=>{c.tabIndex=0;io.observe(c);
  const act=()=>{const s=state.get(c);
    if(still&&s){s.v.paused?(s.on=true,s.v.play().catch(()=>{})):s.v.pause();return}
    if(document.fullscreenElement)document.exitFullscreen();else if(c.requestFullscreen)c.requestFullscreen().catch(()=>{})};
  c.addEventListener('click',act);c.addEventListener('keydown',e=>{if(e.key==='Enter')act()})});
</script>
</body>
</html>
